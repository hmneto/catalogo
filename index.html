<!DOCTYPE html>
<html lang="pt-BR">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no, viewport-fit=cover" />
<meta name="format-detection" content="telephone=no" />
<title>Catálogo de Bolsas</title>
<style>
  :root {
    --bg: #faf7f2;
    --surface: #ffffff;
    --text: #2b2b2b;
    --muted: #8a8a8a;
    --accent: #b8860b;
    --accent-dark: #8a6508;
    --shadow: 0 6px 24px rgba(0, 0, 0, 0.08);
    --radius: 16px;
    --pad-x: clamp(14px, 4vw, 64px);
  }

  * { box-sizing: border-box; margin: 0; padding: 0; }

  html {
    scroll-behavior: smooth;
    -webkit-text-size-adjust: 100%;
    text-size-adjust: 100%;
    touch-action: manipulation;
  }

  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: var(--bg);
    color: var(--text);
    line-height: 1.6;
    overflow-x: hidden;
    touch-action: manipulation;
    -webkit-tap-highlight-color: transparent;
  }

  img { max-width: 100%; display: block; }

  /* ── Header ─────────────────────────────────── */
  header {
    position: sticky;
    top: 0;
    z-index: 100;
    background: rgba(255, 255, 255, 0.92);
    backdrop-filter: blur(10px);
    border-bottom: 1px solid rgba(0, 0, 0, 0.05);
    padding: clamp(10px, 2vw, 16px) var(--pad-x);
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
    gap: 10px;
  }

  .logo {
    font-size: clamp(1.15rem, 3.5vw, 1.5rem);
    font-weight: 700;
    color: var(--accent);
    letter-spacing: 1px;
    display: flex;
    align-items: center;
    gap: 8px;
  }

  .logo span { font-size: 1.4em; }

  nav {
    display: flex;
    align-items: center;
    gap: clamp(10px, 2.5vw, 20px);
    flex-wrap: wrap;
  }

  nav a {
    color: var(--text);
    text-decoration: none;
    font-weight: 500;
    font-size: clamp(0.82rem, 2.4vw, 0.95rem);
    transition: color 0.2s ease;
    touch-action: manipulation;
  }

  nav a:hover { color: var(--accent); }

  /* ── Hero ───────────────────────────────────── */
  .hero {
    text-align: center;
    padding: clamp(36px, 8vw, 64px) var(--pad-x) clamp(24px, 5vw, 40px);
    background: linear-gradient(180deg, #fff8ec 0%, var(--bg) 100%);
  }

  .hero h1 {
    font-size: clamp(1.5rem, 5.5vw, 3rem);
    font-weight: 700;
    margin-bottom: 12px;
    color: var(--text);
    line-height: 1.2;
  }

  .hero h1 em {
    color: var(--accent);
    font-style: normal;
  }

  .hero p {
    color: var(--muted);
    max-width: 620px;
    margin: 0 auto;
    font-size: clamp(0.92rem, 2.6vw, 1.05rem);
  }

  /* ── Filters ────────────────────────────────── */
  .filters {
    display: flex;
    justify-content: center;
    flex-wrap: wrap;
    gap: 8px;
    padding: clamp(14px, 3vw, 20px) var(--pad-x) 8px;
  }

  .filters button {
    border: 1px solid #e2d9c8;
    background: var(--surface);
    color: var(--text);
    padding: 8px clamp(14px, 3vw, 18px);
    border-radius: 999px;
    cursor: pointer;
    font-size: max(0.9rem, 16px);
    font-weight: 500;
    transition: all 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .filters button:hover,
  .filters button.active {
    background: var(--accent);
    color: #fff;
    border-color: var(--accent);
  }

  /* ── Grid ───────────────────────────────────── */
  .grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(min(220px, 100%), 1fr));
    gap: clamp(12px, 2.5vw, 24px);
    padding: clamp(20px, 4vw, 32px) var(--pad-x) clamp(40px, 8vw, 64px);
    max-width: 1400px;
    margin: 0 auto;
    width: 100%;
  }

  /* ── Card ───────────────────────────────────── */
  .card {
    background: var(--surface);
    border-radius: var(--radius);
    overflow: hidden;
    box-shadow: var(--shadow);
    transition: transform 0.25s ease, box-shadow 0.25s ease;
    display: flex;
    flex-direction: column;
    min-width: 0;
    touch-action: manipulation;
  }

  .card:hover {
    transform: translateY(-6px);
    box-shadow: 0 14px 34px rgba(0, 0, 0, 0.14);
  }

  .card__image {
    position: relative;
    aspect-ratio: 3 / 4;
    overflow: hidden;
    background: #f2ece1;
    cursor: zoom-in;
    touch-action: manipulation;
  }

  .card__image img {
    width: 100%;
    height: 100%;
    object-fit: cover;
    transition: transform 0.5s ease;
    -webkit-user-drag: none;
    user-select: none;
  }

  .card:hover .card__image img { transform: scale(1.06); }

  .badge {
    position: absolute;
    top: 10px;
    left: 10px;
    background: var(--accent);
    color: #fff;
    font-size: clamp(0.62rem, 1.8vw, 0.72rem);
    font-weight: 600;
    padding: 4px 10px;
    border-radius: 999px;
    letter-spacing: 0.5px;
    z-index: 2;
  }

  .card__body {
    padding: clamp(12px, 2.5vw, 18px);
    display: flex;
    flex-direction: column;
    gap: 4px;
    flex: 1;
    min-width: 0;
  }

  .card__title {
    font-size: clamp(0.9rem, 2.6vw, 1.05rem);
    font-weight: 600;
    color: var(--text);
    line-height: 1.3;
  }

  .card__desc {
    font-size: clamp(0.75rem, 2.1vw, 0.85rem);
    color: var(--muted);
    line-height: 1.4;
  }

  .card__footer {
    margin-top: auto;
    padding-top: 12px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    gap: 8px;
    flex-wrap: wrap;
  }

  .price {
    font-size: clamp(0.95rem, 2.7vw, 1.1rem);
    font-weight: 700;
    color: var(--accent-dark);
    line-height: 1.2;
  }

  .price small {
    font-size: 0.7em;
    font-weight: 400;
    color: var(--muted);
    display: block;
  }

  .btn-whats {
    display: inline-flex;
    align-items: center;
    gap: 6px;
    background: #25d366;
    color: #fff;
    text-decoration: none;
    font-size: max(0.85rem, 16px);
    font-weight: 600;
    padding: 7px clamp(10px, 2.2vw, 14px);
    border-radius: 999px;
    transition: background 0.2s ease;
    white-space: nowrap;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .btn-whats:hover { background: #1ebe5b; }

  .btn-whats svg { width: 14px; height: 14px; flex-shrink: 0; }

  /* ── Lightbox ───────────────────────────────── */
  .lightbox {
    position: fixed;
    inset: 0;
    background: rgba(0, 0, 0, 0.85);
    display: none;
    align-items: center;
    justify-content: center;
    z-index: 200;
    padding: clamp(16px, 4vw, 24px);
    touch-action: manipulation;
  }

  .lightbox.open { display: flex; }

  .lightbox img {
    max-width: 92vw;
    max-height: 86vh;
    width: auto;
    height: auto;
    border-radius: 12px;
    box-shadow: 0 20px 60px rgba(0, 0, 0, 0.5);
    object-fit: contain;
    user-select: none;
    -webkit-user-drag: none;
  }

  .lightbox__close {
    position: absolute;
    top: clamp(12px, 3vw, 18px);
    right: clamp(14px, 3vw, 22px);
    background: rgba(255, 255, 255, 0.15);
    border: none;
    color: #fff;
    font-size: 1.8rem;
    width: 44px;
    height: 44px;
    border-radius: 50%;
    cursor: pointer;
    display: flex;
    align-items: center;
    justify-content: center;
    transition: background 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .lightbox__close:hover { background: rgba(255, 255, 255, 0.3); }

  /* ── Footer ─────────────────────────────────── */
  footer {
    text-align: center;
    padding: clamp(28px, 6vw, 40px) var(--pad-x);
    background: #fff;
    border-top: 1px solid rgba(0, 0, 0, 0.06);
    color: var(--muted);
    font-size: clamp(0.82rem, 2.3vw, 0.9rem);
  }

  footer strong { color: var(--accent); }

  footer p + p { margin-top: 4px; }

  /* ── Floating WhatsApp ──────────────────────── */
  .floating-whats {
    position: fixed;
    bottom: max(18px, env(safe-area-inset-bottom));
    right: max(18px, env(safe-area-inset-right));
    z-index: 150;
    width: clamp(52px, 13vw, 58px);
    height: clamp(52px, 13vw, 58px);
    border-radius: 50%;
    background: #25d366;
    color: #fff;
    display: flex;
    align-items: center;
    justify-content: center;
    box-shadow: 0 8px 22px rgba(37, 211, 102, 0.45);
    text-decoration: none;
    transition: transform 0.2s ease;
    -webkit-tap-highlight-color: transparent;
    touch-action: manipulation;
  }

  .floating-whats:hover { transform: scale(1.08); }

  .floating-whats svg { width: 55%; height: 55%; }

  /* ── Breakpoints ────────────────────────────── */
  @media (max-width: 900px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(min(200px, 100%), 1fr));
    }
  }

  @media (max-width: 720px) {
    .grid {
      grid-template-columns: repeat(auto-fill, minmax(min(180px, 100%), 1fr));
    }
    .hero h1 { max-width: 90%; margin-inline: auto; }
  }

  @media (max-width: 540px) {
    header {
      justify-content: center;
      text-align: center;
    }
    nav {
      width: 100%;
      justify-content: center;
      order: 3;
    }
    .grid {
      grid-template-columns: repeat(2, minmax(0, 1fr));
      gap: 12px;
    }
    .card__footer {
      flex-direction: column;
      align-items: stretch;
      gap: 10px;
    }
    .price { text-align: left; }
    .btn-whats {
      justify-content: center;
      width: 100%;
      padding: 10px 12px;
      font-size: 16px;
    }
    .filters {
      flex-wrap: nowrap;
      justify-content: flex-start;
      overflow-x: auto;
      scrollbar-width: none;
      -ms-overflow-style: none;
      padding-bottom: 12px;
      scroll-snap-type: x proximity;
    }
    .filters::-webkit-scrollbar { display: none; }
    .filters button {
      flex: 0 0 auto;
      scroll-snap-align: start;
      font-size: 16px;
    }
  }

  @media (max-width: 380px) {
    .grid {
      grid-template-columns: 1fr;
      gap: 14px;
    }
    .card__footer {
      flex-direction: row;
      align-items: center;
      flex-wrap: wrap;
    }
    .btn-whats {
      width: auto;
      flex: 1 1 auto;
      justify-content: center;
    }
    .card__image { aspect-ratio: 4 / 5; }
  }

  @media (max-width: 900px) and (orientation: landscape) and (max-height: 500px) {
    .hero { padding-block: 20px; }
    .hero h1 { font-size: 1.4rem; }
  }

  @media (prefers-reduced-motion: reduce) {
    *, *::before, *::after {
      animation-duration: 0.01ms !important;
      animation-iteration-count: 1 !important;
      transition-duration: 0.01ms !important;
      scroll-behavior: auto !important;
    }
  }
</style>
</head>
<body>
<header>
  <div class="logo"><span>👜</span> Bella Bolsas</div>
  <nav>
    <a href="#catalogo">Catálogo</a>
    <a href="#sobre">Sobre</a>
    <a href="#contato">Contato</a>
  </nav>
</header>

<section class="hero">
  <h1>Coleção <em>Exclusiva</em> de Bolsas</h1>
  <p>Peças selecionadas com acabamento premium. Encontre o modelo perfeito para cada ocasião.</p>
</section>

<div class="filters" id="filters">
  <button class="active" data-filter="all">Todas</button>
  <button data-filter="bolsa">Bolsas</button>
  <button data-filter="carteira">Carteiras</button>
  <button data-filter="mochila">Mochilas</button>
</div>

<main class="grid" id="grid" aria-label="Catálogo de bolsas"></main>

<footer id="contato">
  <p>Feito com 💛 &mdash; <strong>Bella Bolsas</strong> &copy; <span id="year"></span></p>
  <p>Atendimento via WhatsApp: (11) 90000-0000</p>
</footer>

<a class="floating-whats" href="https://wa.me/5511900000000" target="_blank" rel="noopener" aria-label="Falar no WhatsApp">
  <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
</a>

<div class="lightbox" id="lightbox">
  <button class="lightbox__close" aria-label="Fechar">&times;</button>
  <img src="" alt="Imagem ampliada" />
</div>

<script>
  const products = [
    { file: "01.jpeg", name: "Bolsa Elegance", desc: "Couro sintético premium", price: "R$ 189,90", tag: "bolsa", badge: "Novo" },
    { file: "02.jpeg", name: "Bolsa Clássica", desc: "Acabamento fosco", price: "R$ 159,90", tag: "bolsa" },
    { file: "03.jpeg", name: "Bolsa Casual", desc: "Alça ajustável", price: "R$ 149,90", tag: "bolsa" },
    { file: "04.png",  name: "Carteira Slim", desc: "Compacta e sofisticada", price: "R$ 79,90", tag: "carteira", badge: "Promoção" },
    { file: "05.jpeg", name: "Bolsa Tote", desc: "Ampla e espaçosa", price: "R$ 219,90", tag: "bolsa" },
    { file: "06.jpeg", name: "Bolsa Tiracolo", desc: "Alça longa ajustável", price: "R$ 179,90", tag: "bolsa" },
    { file: "07.jpeg", name: "Bolsa Estruturada", desc: "Formato rígido elegante", price: "R$ 239,90", tag: "bolsa" },
    { file: "08.jpeg", name: "Bolsa Mini", desc: "Perfeita para festas", price: "R$ 129,90", tag: "bolsa" },
    { file: "09.jpeg", name: "Bolsa Shopper", desc: "Ideal para o dia a dia", price: "R$ 199,90", tag: "bolsa" },
    { file: "10.jpeg", name: "Bolsa Clutch", desc: "Elegância nas mãos", price: "R$ 139,90", tag: "bolsa" },
    { file: "11.png",  name: "Carteira Compacta", desc: "Porta-cartões integrado", price: "R$ 69,90", tag: "carteira" },
    { file: "12.jpeg", name: "Bolsa Bucket", desc: "Estilo moderno", price: "R$ 189,90", tag: "bolsa" },
    { file: "13.jpeg", name: "Bolsa com Corrente", desc: "Detalhe dourado", price: "R$ 209,90", tag: "bolsa", badge: "Novo" },
    { file: "14.jpeg", name: "Bolsa Hobo", desc: "Formato relaxado", price: "R$ 169,90", tag: "bolsa" },
    { file: "15.jpeg", name: "Bolsa Baguete", desc: "Tendência retrô", price: "R$ 199,90", tag: "bolsa" },
    { file: "16.jpeg", name: "Mochila Estilosa", desc: "Conforto e estilo", price: "R$ 229,90", tag: "mochila" },
    { file: "17.jpeg", name: "Bolsa Satchel", desc: "Clássica atemporal", price: "R$ 249,90", tag: "bolsa" },
    { file: "18.jpeg", name: "Bolsa Wristlet", desc: "Prática e delicada", price: "R$ 99,90", tag: "bolsa" },
    { file: "19.jpeg", name: "Bolsa Luxo", desc: "Acabamento premium", price: "R$ 289,90", tag: "bolsa", badge: "Exclusivo" }
  ];

  const grid = document.getElementById("grid");
  const filters = document.getElementById("filters");
  const lightbox = document.getElementById("lightbox");
  const lightboxImg = lightbox.querySelector("img");
  const whatsNumber = "5511900000000";

  document.getElementById("year").textContent = new Date().getFullYear();

  function render(list) {
    grid.innerHTML = "";
    list.forEach(p => {
      const card = document.createElement("article");
      card.className = "card";
      const badge = p.badge ? `<span class="badge">${p.badge}</span>` : "";
      const msg = encodeURIComponent(`Olá! Tenho interesse na "${p.name}" (${p.price}).`);
      card.innerHTML = `
        <div class="card__image">
          ${badge}
          <img src="${p.file}" alt="${p.name}" loading="lazy" draggable="false" />
        </div>
        <div class="card__body">
          <h3 class="card__title">${p.name}</h3>
          <p class="card__desc">${p.desc}</p>
          <div class="card__footer">
            <div class="price">${p.price}<small>à vista</small></div>
            <a class="btn-whats" href="https://wa.me/${whatsNumber}?text=${msg}" target="_blank" rel="noopener">
              <svg viewBox="0 0 24 24" fill="currentColor"><path d="M17.472 14.382c-.297-.149-1.758-.867-2.03-.967-.273-.099-.471-.148-.67.15-.197.297-.767.966-.94 1.164-.173.199-.347.223-.644.075-.297-.15-1.255-.463-2.39-1.475-.883-.788-1.48-1.761-1.653-2.059-.173-.297-.018-.458.13-.606.134-.133.298-.347.446-.52.149-.174.198-.298.298-.497.099-.198.05-.371-.025-.52-.075-.149-.669-1.612-.916-2.207-.242-.579-.487-.5-.669-.51-.173-.008-.371-.01-.57-.01-.198 0-.52.074-.792.372-.272.297-1.04 1.016-1.04 2.479 0 1.462 1.065 2.875 1.213 3.074.149.198 2.096 3.2 5.077 4.487.709.306 1.262.489 1.694.625.712.227 1.36.195 1.871.118.571-.085 1.758-.719 2.006-1.413.248-.694.248-1.289.173-1.413-.074-.124-.272-.198-.57-.347m-5.421 7.403h-.004a9.87 9.87 0 01-5.031-1.378l-.361-.214-3.741.982.998-3.648-.235-.374a9.86 9.86 0 01-1.51-5.26c.001-5.45 4.436-9.884 9.888-9.884 2.64 0 5.122 1.03 6.988 2.898a9.825 9.825 0 012.893 6.994c-.003 5.45-4.437 9.884-9.885 9.884m8.413-18.297A11.815 11.815 0 0012.05 0C5.495 0 .16 5.335.157 11.892c0 2.096.547 4.142 1.588 5.945L.057 24l6.305-1.654a11.882 11.882 0 005.683 1.448h.005c6.554 0 11.89-5.335 11.893-11.893a11.821 11.821 0 00-3.48-8.413z"/></svg>
              Comprar
            </a>
          </div>
        </div>
      `;
      card.querySelector(".card__image").addEventListener("click", () => {
        lightboxImg.src = p.file;
        lightboxImg.alt = p.name;
        lightbox.classList.add("open");
      });
      grid.appendChild(card);
    });
  }

  filters.addEventListener("click", (e) => {
    const btn = e.target.closest("button");
    if (!btn) return;
    filters.querySelectorAll("button").forEach(b => b.classList.remove("active"));
    btn.classList.add("active");
    const f = btn.dataset.filter;
    render(f === "all" ? products : products.filter(p => p.tag === f));
  });

  lightbox.addEventListener("click", (e) => {
    if (e.target === lightbox || e.target.classList.contains("lightbox__close")) {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    }
  });

  document.addEventListener("keydown", (e) => {
    if (e.key === "Escape") {
      lightbox.classList.remove("open");
      lightboxImg.src = "";
    }
  });

  render(products);
</script>
</body>
</html>
